<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contractor Login — MRK AGENCY</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root { --blue:#1A56DB; --dark:#0A0F1E; --bg:#F8F9FB; --white:#ffffff; --border:#E2E8F0; --text:#1E293B; --muted:#64748B; --red:#DC2626; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; }
    nav { background:var(--dark); border-bottom:2px solid var(--blue); padding:0 1.5rem; height:64px; display:flex; align-items:center; justify-content:space-between; }
    .nav-brand { color:var(--white); font-size:1.15rem; font-weight:700; letter-spacing:0.05em; text-decoration:none; }
    .nav-brand span { color:var(--blue); }
    .nav-links a { color:#CBD5E1; text-decoration:none; font-size:0.85rem; font-weight:500; }
    .main { flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 1.5rem; }
    .card { background:var(--white); border:1px solid var(--border); border-radius:16px; padding:2.25rem 2rem; width:100%; max-width:400px; box-shadow:0 4px 24px rgba(0,0,0,0.06); }
    .card-title { font-size:1.5rem; font-weight:700; color:var(--dark); margin-bottom:0.25rem; }
    .card-title span { color:var(--blue); }
    .card-sub { font-size:0.85rem; color:var(--muted); margin-bottom:1.75rem; }
    .form-group { margin-bottom:1rem; }
    .form-group label { display:block; font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:0.4rem; }
    .form-group input { width:100%; padding:0.7rem 1rem; border:1.5px solid var(--border); border-radius:9px; font-size:0.9rem; font-family:'Inter',sans-serif; color:var(--text); background:var(--bg); outline:none; transition:border-color 0.2s,background 0.2s; }
    .form-group input:focus { border-color:var(--blue); background:var(--white); }
    .form-group input::placeholder { color:#B0BDCA; }
    .submit-btn { width:100%; padding:0.78rem; background:var(--blue); color:var(--white); border:none; border-radius:9px; font-size:0.9rem; font-weight:700; font-family:'Inter',sans-serif; cursor:pointer; margin-top:0.5rem; transition:opacity 0.2s; }
    .submit-btn:hover { opacity:0.88; }
    .alert-error { background:#FEF2F2; border:1px solid #FECACA; color:#991B1B; border-radius:8px; padding:0.75rem 1rem; font-size:0.85rem; margin-bottom:1.25rem; }
    .bottom-link { text-align:center; margin-top:1.25rem; font-size:0.83rem; color:var(--muted); }
    .bottom-link a { color:var(--blue); font-weight:600; text-decoration:none; }
    .cin-hint { background:#EFF6FF; border:1px solid #BFDBFE; border-radius:8px; padding:0.65rem 0.9rem; font-size:0.8rem; color:#1E40AF; margin-bottom:1.25rem; }
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">MRK <span>AGENCY</span></a>
  <div class="nav-links"><a href="/contractor-apply">Apply as Contractor</a></div>
</nav>
<div class="main">
  <div class="card">
    <div class="card-title">Contractor <span>Login</span></div>
    <div class="card-sub">Sign in with your CIN and password issued by MRK AGENCY.</div>
    <div class="cin-hint">🔒 Your CIN (Contractor ID Number) was sent to you upon CEO approval.</div>
    {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
    <form action="/contractor-login" method="POST">
      <div class="form-group"><label>CIN — Contractor ID</label><input type="text" name="cin" placeholder="e.g. MRK12345" required autocomplete="off"/></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" placeholder="Your password" required/></div>
      <button type="submit" class="submit-btn">Sign In</button>
    </form>
    <div class="bottom-link">Not a contractor yet? <a href="/contractor-apply">Apply here</a></div>
    <div class="bottom-link" style="margin-top:0.5rem;">Are you a client? <a href="/login">Client Login</a></div>
  </div>
</div>
</body>
    </html>
