<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CEO Portal — MRK AGENCY</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --blue: #1A56DB;
      --dark: #0A0F1E;
      --bg: #F8F9FB;
      --white: #ffffff;
      --border: #E2E8F0;
      --text: #1E293B;
      --muted: #64748B;
      --red: #DC2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      background: var(--dark);
      border-bottom: 2px solid var(--blue);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-brand { color: var(--white); font-size: 1.2rem; font-weight: 700; letter-spacing: 0.05em; text-decoration: none; }
    .nav-brand span { color: var(--blue); }
    .nav-links a { color: #CBD5E1; text-decoration: none; font-size: 0.85rem; font-weight: 500; }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .login-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }

    /* HEADER */
    .card-header { text-align: center; margin-bottom: 2rem; }
    .restricted-tag {
      display: inline-block;
      background: #FEF2F2;
      color: var(--red);
      border: 1px solid #FECACA;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.25rem 0.85rem;
      margin-bottom: 1rem;
    }
    .card-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 0.3rem;
    }
    .card-header h1 span { color: var(--blue); }
    .card-header p { font-size: 0.85rem; color: var(--muted); }

    /* DIVIDER */
    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 1.75rem;
    }

    /* FORM */
    .form-group { margin-bottom: 1.1rem; }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .form-group input:focus {
      border-color: var(--blue);
      background: var(--white);
    }
    .form-group input::placeholder { color: #B0BDCA; }

    /* SUBMIT */
    .submit-btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--blue);
      color: var(--white);
      border: none;
      border-radius: 9px;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 0.5rem;
      letter-spacing: 0.03em;
      transition: opacity 0.2s;
    }
    .submit-btn:hover { opacity: 0.88; }

    /* ERROR */
    .alert-error {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
      text-align: center;
    }

    /* FOOTER */
    .card-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.03em;
    }
    .card-footer strong { color: var(--dark); }

    footer {
      text-align: center;
      padding: 1.25rem;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">MRK <span>AGENCY</span></a>
  <div class="nav-links">
    <a href="/">← Back to Site</a>
  </div>
</nav>

<div class="main">
  <div class="login-card">

    <div class="card-header">
      <div class="restricted-tag">⚠ Restricted Access</div>
      <h1>CEO <span>Portal</span></h1>
      <p>Authorized personnel only. All access is logged.</p>
    </div>

    <div class="divider"></div>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form action="/ceo-login" method="POST">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your name" required autocomplete="off"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="CEO password" required/>
      </div>
      <div class="form-group">
        <label>Secret Key</label>
        <input type="password" name="secret_key" placeholder="Secret key" required/>
      </div>
      <div class="form-group">
        <label>Security Answer</label>
        <input type="password" name="security_answer" placeholder="Security answer" required/>
      </div>
      <button type="submit" class="submit-btn">ENTER PORTAL</button>
    </form>

    <div class="card-footer">
      <strong>MRK AGENCY</strong> &nbsp;·&nbsp; CONFIDENTIAL
    </div>

  </div>
</div>

<footer>
  MRK AGENCY &nbsp;·&nbsp; CEO Portal &nbsp;·&nbsp; Unauthorized access is prohibited.
</footer>

</body>
    </html>
