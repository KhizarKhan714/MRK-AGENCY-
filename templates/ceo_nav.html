<!-- ceo_nav.html — include this right after the opening body tag on every
     CEO admin page (Jinja's include directive, pointed at this filename).
     Set active_page in render_template() so the current section highlights.
     Fully self-contained — no dependency on the host page's CSS.
     IMPORTANT: this only renders correctly when served by Flask — opening
     this file directly in a browser (not through the live site) will show
     the raw templating syntax as plain text, which is expected and not a
     bug. Always test via the live site URL. -->
<div class="ceo-header">
  <div class="ceo-topbar">
    <a href="/" class="nav-brand">MRK <span>AGENCY</span></a>
    <div class="ceo-topright">
      <span class="ceo-badge">CEO PORTAL</span>
      <a href="/ceo/account" class="util-link">CEO Account</a>
      <a href="/ceo-logout" class="util-link logout-link">Logout</a>
    </div>
  </div>
  <nav class="ceo-section-nav">
    <a href="/ceo-dashboard" class="{% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
    <a href="/ceo/projects" class="{% if active_page == 'projects' %}active{% endif %}">Projects</a>
    <a href="/ceo/contractors" class="{% if active_page == 'contractors' %}active{% endif %}">Contractors</a>
    <a href="/ceo/clients" class="{% if active_page == 'clients' %}active{% endif %}">Clients</a>
    <a href="/ceo/finance" class="{% if active_page == 'finance' %}active{% endif %}">Finance</a>
    <a href="/ceo/discounts" class="{% if active_page == 'discounts' %}active{% endif %}">Discounts</a>
    <a href="/ceo/portfolio" class="{% if active_page == 'portfolio' %}active{% endif %}">Portfolio</a>
    <a href="/ceo/website-settings" class="{% if active_page == 'website' %}active{% endif %}">Website CMS</a>
    <a href="/ceo/website-status" class="{% if active_page == 'website-status' %}active{% endif %}">Website Status</a>
    <a href="/ceo/analytics" class="{% if active_page == 'analytics' %}active{% endif %}">Analytics</a>
    <a href="/ceo/ai-center" class="{% if active_page == 'ai' %}active{% endif %}">AI Assistant</a>
    <a href="/ceo/audit-log" class="{% if active_page == 'audit' %}active{% endif %}">Audit Log</a>
    <a href="/ceo/security" class="{% if active_page == 'security' %}active{% endif %}">Security</a>
    <a href="/ceo/system-health" class="{% if active_page == 'system-health' %}active{% endif %}">System Health</a>
    <a href="/ceo/notifications" class="{% if active_page == 'notifications' %}active{% endif %}">Notifications</a>
  </nav>
</div>

<style>
  .ceo-header { position: sticky; top: 0; z-index: 100; font-family: 'Inter', sans-serif; }

  .ceo-topbar {
    background: #0A0F1E; border-bottom: 2px solid #1A56DB;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.85rem 1.25rem;
  }
  .nav-brand { color: #ffffff; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.04em; text-decoration: none; white-space: nowrap; }
  .nav-brand span { color: #4C7DF0; }

  .ceo-topright { display: flex; align-items: center; gap: 1.1rem; }

  .ceo-badge {
    background: #1A56DB; color: #ffffff;
    padding: 0.32rem 0.85rem; border-radius: 999px;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .util-link { color: #94A3B8; text-decoration: none; font-size: 0.82rem; font-weight: 600; white-space: nowrap; transition: color 0.15s; }
  .util-link:hover { color: #E2E8F0; }
  .logout-link:hover { color: #F87171; }

  @media (max-width: 460px) {
    .ceo-topright { gap: 0.7rem; }
    .util-link { font-size: 0.76rem; }
    .ceo-badge { padding: 0.28rem 0.65rem; font-size: 0.64rem; }
    .nav-brand { font-size: 1.02rem; }
  }

  .ceo-section-nav {
    background: #ffffff; border-bottom: 1px solid #E2E8F0;
    display: flex; gap: 0.25rem; overflow-x: auto;
    padding: 0 1rem;
  }
  .ceo-section-nav a {
    display: flex; align-items: center;
    padding: 0.85rem 0.9rem; font-size: 0.83rem; font-weight: 600;
    color: #64748B; text-decoration: none; white-space: nowrap;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color 0.18s, border-color 0.18s;
  }
  .ceo-section-nav a:hover { color: #1E293B; }
  .ceo-section-nav a.active { color: #1A56DB; border-bottom-color: #1A56DB; }
       </style>
