<!-- ceo_nav.html — include this right after the opening body tag on every
     CEO admin page (Jinja's include directive, pointed at this filename).
     Set active_page in render_template() (e.g. active_page='dashboard') so the
     current section highlights. Fully self-contained — no dependency on the
     host page's CSS variables, so it always renders correctly. -->
<nav class="ceo-topnav">
  <div class="ceo-brand-group">
    <a href="/" class="nav-brand">MRK <span>AGENCY</span></a>
    <span class="division-badge">AGENCY</span>
  </div>
  <div class="nav-right">
    <span class="ceo-badge">CEO PORTAL</span>
    <a href="/ceo-logout">Logout</a>
  </div>
</nav>
<div class="ceo-section-nav">
  <a href="/ceo-dashboard" class="{% if active_page == 'dashboard' %}active{% endif %}">📊 Dashboard</a>
  <a href="/ceo/projects" class="{% if active_page == 'projects' %}active{% endif %}">📋 Projects</a>
  <a href="/ceo/contractors" class="{% if active_page == 'contractors' %}active{% endif %}">👷 Contractors</a>
  <a href="/ceo/clients" class="{% if active_page == 'clients' %}active{% endif %}">🧑‍💼 Clients</a>
  <a href="/ceo/finance" class="{% if active_page == 'finance' %}active{% endif %}">💰 Finance</a>
  <a href="/ceo/portfolio" class="{% if active_page == 'portfolio' %}active{% endif %}">🖼 Portfolio</a>
  <a href="/ceo/website-settings" class="{% if active_page == 'website' %}active{% endif %}">🌐 Website CMS</a>
  <a href="/ceo/analytics" class="{% if active_page == 'analytics' %}active{% endif %}">📈 Analytics</a>
  <a href="/ceo/ai-center" class="{% if active_page == 'ai' %}active{% endif %}">🤖 AI Assistant</a>
  <a href="/ceo/notifications" class="{% if active_page == 'notifications' %}active{% endif %}">🔔 Notifications</a>
</div>

<style>
  /* Self-contained — hardcoded values on purpose, does NOT rely on the
     including page's :root variables, so it can never render unstyled. */
  .ceo-topnav {
    background: #0A0F1E; border-bottom: 2px solid #1A56DB;
    padding: 0 2rem; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    font-family: 'Inter', sans-serif;
  }
  .ceo-brand-group { display: flex; align-items: center; gap: 0.6rem; }
  .ceo-topnav .nav-brand { color: #ffffff; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.05em; text-decoration: none; }
  .ceo-topnav .nav-brand span { color: #1A56DB; }
  .division-badge {
    background: rgba(26,86,219,0.15); color: #93C5FD; border: 1px solid rgba(26,86,219,0.4);
    font-size: 0.66rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0.2rem 0.6rem; border-radius: 999px;
  }
  .ceo-topnav .nav-right { display: flex; align-items: center; gap: 1.5rem; }
  .ceo-topnav .nav-right a { color: #CBD5E1; text-decoration: none; font-size: 0.85rem; font-weight: 500; }
  .ceo-topnav .nav-right a:hover { color: #ffffff; }
  .ceo-badge { background: #1A56DB; color: #ffffff; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }

  .ceo-section-nav {
    background: #ffffff; border-bottom: 1px solid #E2E8F0;
    display: flex; gap: 0.25rem; overflow-x: auto;
    padding: 0 1rem; position: sticky; top: 64px; z-index: 99;
    font-family: 'Inter', sans-serif;
  }
  .ceo-section-nav a {
    display: flex; align-items: center; gap: 0.4rem;
    padding: 0.85rem 0.9rem; font-size: 0.83rem; font-weight: 600;
    color: #64748B; text-decoration: none; white-space: nowrap;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color 0.2s, border-color 0.2s;
  }
  .ceo-section-nav a:hover { color: #1E293B; }
  .ceo-section-nav a.active { color: #1A56DB; border-bottom-color: #1A56DB; }
      </style>
