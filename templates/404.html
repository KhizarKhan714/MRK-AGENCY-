    p { font-size: 0.92rem; color: var(--muted); margin-bottom: 1.75rem; max-width: 380px; }
    .btn { display: inline-block; padding: 0.7rem 1.75rem; border-radius: 8px; font-size: 0.88rem; font-weight: 600; text-decoration: none; background: var(--blue); color: var(--white); }
